services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: stjosephs
      MYSQL_USER: stjosephs
      MYSQL_PASSWORD: stjosephs_pw
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -prootpw --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: stjosephs
      DB_USER: stjosephs
      DB_PASS: stjosephs_pw
    volumes:
      - ./public_html:/var/www/html
      - ./database:/var/www/database
    ports:
      - "127.0.0.1:8090:80"

volumes:
  dbdata:
