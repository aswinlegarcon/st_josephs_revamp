document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

elect{font-family:inherit}\n  ::placeholder{color:#9aa4b6}\n  ::-webkit-scrollbar{width:10px;height:10px}\n  ::-webkit-scrollbar-thumb{background:#cfd6e4;border-radius:9px;border:2px solid transparent;background-clip:content-box}\n  @keyframes sjmodal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}\n  @keyframes sjblink{0%,100%{opacity:1}50%{opacity:.25}}\n  @keyframes sjshim{0%{background-position:-320px 0}100%{background-position:320px 0}}\n  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex;min-height:100vh\">\n  <sc-if value=\"{{ drawer }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeDrawer }}\" style=\"position:fixed;inset:0;background:rgba(10,18,33,.6);z-index:40\"><\u002Fdiv>\n  <\u002Fsc-if>\n  <aside style=\"{{ s.sidebar }}\">\n    <div style=\"padding:18px 16px 6px;display:flex;align-items:center;gap:11px;flex-shrink:0\">\n      <div style=\"width:38px;height:38px;border-radius:11px;background:#ffd700;display:flex;align-items:center;justify-content:center;color:#1a355d;font-weight:800;font-size:16px;letter-spacing:-.5px\">SJ<\u002Fdiv>\n      <div style=\"line-height:1.2;min-width:0\">\n        <div style=\"color:#fff;font-size:15px;font-weight:700\">St.Joseph's<\u002Fdiv>\n        <div style=\"color:#ffd700;font-size:10.5px;letter-spacing:.4px\">ADMIN PANEL<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding:8px 14px 6px;flex-shrink:0\">\n      <div style=\"display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:8px 10px\">\n        <span style=\"color:#8fa0c0;display:inline-flex;flex-shrink:0\">{{ icSearch }}<\u002Fspan>\n        <input placeholder=\"Search…\" style=\"flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;font-size:13px;font-family:inherit\">\n        <span style=\"font-size:10px;color:#9fb0cf;background:rgba(255,255,255,.09);border-radius:5px;padding:1px 6px;flex-shrink:0\">⌘F<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <nav style=\"flex:1;overflow-y:auto;padding:10px 10px 16px\">\n      <sc-for list=\"{{ nav }}\" as=\"g\" hint-placeholder-count=\"5\">\n        <sc-if value=\"{{ g.label }}\"><div style=\"{{ s.grpLabel }}\">{{ g.label }}<\u002Fdiv><\u002Fsc-if>\n        <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ it.go }}\" style=\"{{ it.style }}\" style-hover=\"background:rgba(255,255,255,.09)\">\n            <span style=\"display:inline-flex;align-items:center;justify-content:center;width:22px;flex-shrink:0\">{{ it.icon }}<\u002Fspan>\n            <span style=\"flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ it.label }}<\u002Fspan>\n            <sc-if value=\"{{ it.chip }}\"><span style=\"{{ s.navChip }}\">{{ it.chip }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fsc-for>\n    <\u002Fnav>\n    <div style=\"padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px;flex-shrink:0\">\n      <button style=\"display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:none;background:transparent;color:#b7c2da;font-size:13px;font-weight:500;cursor:pointer;border-radius:10px;font-family:inherit\" style-hover=\"background:rgba(255,255,255,.09);color:#fff\"><span style=\"display:inline-flex;width:22px;justify-content:center\">{{ icHelp }}<\u002Fspan><span style=\"flex:1;text-align:left\">Help center<\u002Fspan><\u002Fbutton>\n      <button style=\"display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border:none;background:transparent;color:#b7c2da;font-size:13px;font-weight:500;cursor:pointer;border-radius:10px;font-family:inherit\" style-hover=\"background:rgba(255,255,255,.09);color:#fff\"><span style=\"display:inline-flex;width:22px;justify-content:center\">{{ icBell }}<\u002Fspan><span style=\"flex:1;text-align:left\">Notifications<\u002Fspan><span style=\"background:#e5484d;color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px\">3<\u002Fspan><\u002Fbutton>\n      <div style=\"display:flex;align-items:center;gap:10px;padding:9px 10px;margin-top:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);border-radius:13px\">\n        <div style=\"width:34px;height:34px;border-radius:10px;background:#ffd700;color:#1a355d;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0\">A<\u002Fdiv>\n        <div style=\"flex:1;min-width:0;line-height:1.25\"><div style=\"color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Admin<\u002Fdiv><div style=\"color:#8fa0c0;font-size:11px\">Owner · Ondipudur<\u002Fdiv><\u002Fdiv>\n        <button aria-label=\"Account\" style=\"border:none;background:transparent;color:#9fb0cf;cursor:pointer;display:inline-flex;padding:4px\">{{ icDots }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh\">\n    <header style=\"{{ s.topbar }}\">\n      <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n        <sc-if value=\"{{ m }}\"><button sc-camel-on-click=\"{{ openDrawer }}\" aria-label=\"Open menu\" style=\"{{ s.ico }}\" style-hover=\"background:#eef1f7\">☰<\u002Fbutton><\u002Fsc-if>\n        <button sc-camel-on-click=\"{{ back }}\" aria-label=\"Back\" style=\"{{ s.ico }}\" style-hover=\"background:#eef1f7\">{{ icBack }}<\u002Fbutton>\n        <div style=\"display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden\">\n          <sc-for list=\"{{ crumbs }}\" as=\"cb\" hint-placeholder-count=\"2\">\n            <sc-if value=\"{{ cb.sep }}\"><span style=\"color:#c3ccdd;font-size:13px\">/<\u002Fspan><\u002Fsc-if>\n            <span style=\"{{ cb.style }}\">{{ cb.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;flex-shrink:0\">\n        <button style=\"{{ s.btnG }}\" style-hover=\"background:#f4f6fb\">{{ icOpen }} Preview<\u002Fbutton>\n        <button aria-label=\"More\" style=\"{{ s.ico }}\" style-hover=\"background:#eef1f7\">{{ icDots }}<\u002Fbutton>\n        <div style=\"width:34px;height:34px;border-radius:10px;background:#1a355d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0\">A<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"{{ s.content }}\">\n      <!-- ===== DASHBOARD ===== -->\n      <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:300px\">\n            <p style=\"font-size:14px;color:#7a8598;margin:0 0 18px\">Welcome back, Admin. Here's what's happening across St.Joseph's site.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:24px\">\n              <sc-for list=\"{{ stats }}\" as=\"st\" hint-placeholder-count=\"4\">\n                <div style=\"{{ s.card }}\">\n                  <div style=\"font-family:'Fjalla One',sans-serif;font-size:34px;color:#1a355d;line-height:1\">{{ st.n }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#5f6b80;margin-top:8px\">{{ st.l }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px\">\n              <sc-for list=\"{{ navCards }}\" as=\"nc\" hint-placeholder-count=\"8\">\n                <button sc-camel-on-click=\"{{ nc.go }}\" style=\"{{ s.navCard }}\" style-hover=\"box-shadow:0 8px 26px rgba(26,53,93,.14);transform:translateY(-1px)\">\n                  <div style=\"width:38px;height:38px;border-radius:9px;background:#eef1f7;color:#2b4b8a;display:flex;align-items:center;justify-content:center;margin-bottom:12px\">{{ nc.icon }}<\u002Fdiv>\n                  <div style=\"font-size:15px;font-weight:700;color:#1a355d\">{{ nc.title }}<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#7a8598;margin:3px 0 12px\">{{ nc.desc }}<\u002Fdiv>\n                  <span style=\"{{ s.chip }}\">{{ nc.chip }}<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:320px;max-width:100%;display:flex;flex-direction:column;gap:16px\">\n            <div style=\"{{ s.card }}\">\n              <div style=\"font-size:15.5px;font-weight:700;color:#1a355d;margin-bottom:14px\">Site health<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#5f6b80;display:flex;justify-content:space-between;margin-bottom:6px\"><span>Storage used<\u002Fspan><span>1.8 / 5 GB<\u002Fspan><\u002Fdiv>\n              <div style=\"height:8px;background:#eef1f7;border-radius:999px;overflow:hidden;margin-bottom:16px\"><div style=\"width:36%;height:100%;background:linear-gradient(to right,#2b4b8a,#1a355d);border-radius:999px\"><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid #e2e7f0\"><span style=\"color:#5f6b80\">Largest image<\u002Fspan><span style=\"font-weight:600\">3.2 MB<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid #e2e7f0\"><span style=\"color:#5f6b80\">Missing alt text<\u002Fspan><span style=\"font-weight:700;color:#b26a00\">7 images<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-top:1px solid #e2e7f0\"><span style=\"color:#5f6b80\">Last backup<\u002Fspan><span style=\"font-weight:600\">2h ago<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ s.card }}\">\n              <div style=\"font-size:15.5px;font-weight:700;color:#1a355d;margin-bottom:12px\">Recent changes<\u002Fdiv>\n              <sc-for list=\"{{ recent }}\" as=\"rc\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;gap:10px;padding:9px 0;border-top:1px solid #e2e7f0\">\n                  <span style=\"{{ rc.pill }}\">{{ rc.action }}<\u002Fspan>\n                  <div style=\"min-width:0\"><div style=\"font-size:13px;color:#26303f;line-height:1.35\">{{ rc.summary }}<\u002Fdiv><div style=\"font-size:11.5px;color:#7a8598\">{{ rc.time }}<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== SHARED LIST MANAGER ===== -->\n      <sc-if value=\"{{ isLM }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px\">\n          <div><h2 style=\"{{ s.h2 }}\">{{ lm.title }}<\u002Fh2><p style=\"{{ s.lead }}\">{{ lm.lead }}<\u002Fp><\u002Fdiv>\n          <button sc-camel-on-click=\"{{ lm.add }}\" style=\"{{ s.btnP }}\" style-hover=\"filter:brightness(1.12)\">{{ ic.plus }}{{ lm.addLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <sc-if value=\"{{ lm.note }}\"><div style=\"{{ s.note }}\">{{ lm.note }}<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ lm.rows }}\" as=\"r\" hint-placeholder-count=\"5\">\n            <div draggable=\"true\" sc-camel-on-drag-start=\"{{ r.onDragStart }}\" sc-camel-on-drag-over=\"{{ onDragOver }}\" sc-camel-on-drop=\"{{ r.onDrop }}\" style=\"{{ r.style }}\">\n              <span aria-hidden=\"true\" style=\"{{ s.handle }}\">⠿<\u002Fspan>\n              <sc-if value=\"{{ lm.hasThumb }}\"><div style=\"{{ r.thumbStyle }}\"><span style=\"{{ s.thumbLbl }}\">{{ r.preset }}<\u002Fspan><\u002Fdiv><\u002Fsc-if>\n              <div style=\"flex:1;min-width:0\">\n                <div style=\"font-weight:700;color:#1a355d;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ r.title }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#7a8598;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px\">{{ r.sub }}<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ r.badge }}\"><span style=\"{{ r.badgeStyle }}\">{{ r.badge }}<\u002Fspan><\u002Fsc-if>\n              <div style=\"display:flex;gap:6px;align-items:center;flex-shrink:0\">\n                <button sc-camel-on-click=\"{{ r.edit }}\" aria-label=\"Edit\" style=\"{{ s.ico }}\" style-hover=\"background:#dde3f0\">{{ ic.edit }}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ r.up }}\" aria-label=\"Move up\" style=\"{{ s.ico }}\" style-hover=\"background:#dde3f0\">{{ ic.up }}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ r.down }}\" aria-label=\"Move down\" style=\"{{ s.ico }}\" style-hover=\"background:#dde3f0\">{{ ic.down }}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ r.toggle }}\" aria-label=\"Toggle visibility\" style=\"{{ s.ico }}\" style-hover=\"background:#dde3f0\">{{ r.eye }}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ r.del }}\" aria-label=\"Delete\" style=\"{{ s.icoDel }}\" style-hover=\"background:#fdecea\">{{ ic.trash }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ lm.empty }}\">\n          <div style=\"{{ s.emptyBox }}\">\n            <div style=\"font-size:40px;opacity:.35\">＋<\u002Fdiv>\n            <div style=\"font-size:15px;font-weight:700;color:#1a355d;margin-top:8px\">Nothing here yet<\u002Fdiv>\n            <div style=\"font-size:12.5px;color:#7a8598;margin:4px 0 14px\">Add the first item to get started.<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ lm.add }}\" style=\"{{ s.btnP }}\">{{ ic.plus }}{{ lm.addLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fsc-if>\n\n      <!-- ===== LOGIN ===== -->\n      <sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ s.authWrap }}\">\n          <div style=\"{{ loginCard }}\">\n            <div style=\"{{ loginBrand }}\">\n              <div style=\"display:flex;align-items:center;gap:11px\">\n                <div style=\"width:42px;height:42px;border-radius:12px;background:#ffd700;color:#1a355d;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px\">SJ<\u002Fdiv>\n                <div style=\"line-height:1.2\"><div style=\"font-size:15px;font-weight:700\">St.Joseph's<\u002Fdiv><div style=\"font-size:10.5px;color:#ffd700;letter-spacing:.4px\">ADMIN PANEL<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:25px;font-weight:800;line-height:1.28;letter-spacing:-.3px\">Manage your school website in one calm place.<\u002Fdiv>\n                <div style=\"font-size:13.5px;color:#c8d3e8;margin-top:14px;line-height:1.6\">Hero slides, galleries, academies, results and more — all from a single secure dashboard.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12px;color:#8fa0c0\">St.Joseph's MHSS, Ondipudur · Coimbatore<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ loginFormWrap }}\">\n              <div style=\"font-size:23px;font-weight:800;color:#1a355d;letter-spacing:-.2px\">Sign in<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#7a8598;margin:6px 0 26px\">Welcome back. Please enter your details.<\u002Fdiv>\n              <label style=\"{{ s.label }}\">Username<\u002Flabel>\n              <input sc-camel-default-value=\"admin\" style=\"{{ loginInput }};margin-bottom:16px\" style-focus=\"border-color:#2b4b8a;background:#fff;box-shadow:0 0 0 3px rgba(43,75,138,.14)\">\n              <label style=\"{{ s.label }}\">Password<\u002Flabel>\n              <div style=\"position:relative;margin-bottom:10px\">\n                <input type=\"{{ pwType }}\" sc-camel-default-value=\"stjoseph@2025\" style=\"{{ loginInput }};padding-right:44px\" style-focus=\"border-color:#2b4b8a;background:#fff;box-shadow:0 0 0 3px rgba(43,75,138,.14)\">\n                <button sc-camel-on-click=\"{{ togglePw }}\" aria-label=\"Show password\" style=\"position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:transparent;cursor:pointer;color:#7a8598;display:inline-flex;padding:4px\">{{ pwEye }}<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"text-align:right;margin-bottom:22px\"><a href=\"#\" style=\"font-size:12.5px\">Forgot password?<\u002Fa><\u002Fdiv>\n              <button sc-camel-on-click=\"{{ signIn }}\" style=\"{{ btnPfull }}\" style-hover=\"filter:brightness(1.1)\">Sign in<\u002Fbutton>\n              <div style=\"text-align:center;margin-top:22px\"><a href=\"#\" style=\"font-size:13px;color:#7a8598\">← Back to website<\u002Fa><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ===== PASSWORD CHANGE ===== -->\n      <sc-if value=\"{{ isPwScreen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"{{ s.authWrap }}\">\n          <div style=\"{{ s.authCard }}\">\n            <div style=\"text-align:center;font-size:20px;font-weight:700;color:#1a355d;margin-bottom:4px\">Set a new password<\u002Fdiv>\n            <div style=\"text-align:center;font-size:12.5px;color:#7a8598;margin-
